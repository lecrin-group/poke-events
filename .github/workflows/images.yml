name: images
# 公式ページの画像（og:image）の URL を images.json に集める（画像そのものはコピーしない）
# ・毎日 17:40（日本時間。イベントの取り込みのあと）にイベントの分
# ・spots/ が変わったとき（毎月の作り直し）にスポットの分
# ・noimage.txt が変わったら（権利者から外してと言われたとき）すぐ全部やり直して、その画像を消す
on:
  schedule:
    - cron: "40 8 * * *"
  push:
    branches: [main]
    paths: ["noimage.txt", "spots/index.json", "events.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 集める
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^spots/' || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/add_images.py all
          else
            python3 tools/add_images.py events
          fi
      - run: |
          git config user.name "poke-events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json tools/images_cache.json
          git diff --cached --quiet && exit 0
          git commit -m "images $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
